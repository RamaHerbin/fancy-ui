name: Preview health (nightly)

# The two preview-health sweeps that do not belong on every pull request:
#
#   no-gpu      the built develop site in headless Chromium with no GPU flags,
#               which shows the demos that have no fallback without WebGL
#               (failures there are classed GPU_ONLY)
#   production  the live site, swept as it is served; nothing is built, the
#               slug list comes from the checked-out main, which is what the
#               site is built from. Manual only: it loads every component page
#               twice from the CDN with a cold cache, which a nightly schedule
#               turns into a large share of the hosting plan's monthly request
#               allowance. Run it after a release, with the `production` input.
#
# The pull-request sweep (projects gpu and gpu-light-rm on the PR's own build)
# is the preview-health job in ci.yml. See tests/e2e/preview-health.spec.ts and
# playwright.preview-health.config.ts for what each probe checks.

on:
  schedule:
    # 03:17 UTC: off the hour, when scheduled runs queue the least.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      production:
        description: Also sweep the live site (hundreds of cold page loads against the CDN)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-health-nightly
  cancel-in-progress: false

jobs:
  no-gpu:
    name: No GPU (develop build)
    runs-on: ubuntu-24.04
    # Until every WebGL demo has a fallback: GPU_ONLY failures are expected here today.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same Chromium cache key as ci.yml and e2e.yml.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The config builds the site and serves `vite preview` itself.
      - run: pnpm exec playwright test -c playwright.preview-health.config.ts --project no-gpu

      - name: Upload the preview-health summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-health-no-gpu
          path: test-results/preview-health.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the failing-stage screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-health-no-gpu-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  production:
    name: Production site
    # Never on the schedule: see the header.
    if: github.event_name == 'workflow_dispatch' && inputs.production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Sweep the deployed site: no build, no local server.
      PREVIEW_HEALTH_BASE: https://fancy-ui.rama.app
    steps:
      # main is what production is built from, so its registry lists exactly the
      # pages the live site serves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Projects gpu + gpu-light-rm, against PREVIEW_HEALTH_BASE.
      - run: pnpm test:preview-health

      - name: Upload the preview-health summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-health-production
          path: test-results/preview-health.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the failing-stage screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-health-production-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
