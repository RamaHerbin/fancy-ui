name: CI

on:
  # Run on regular PRs targeting main or develop
  pull_request:
    branches: [main, develop]
  # Run on the automated Changesets release PR (opened by github-actions[bot]).
  # pull_request_target runs the workflow from the base branch so the latest
  # workflow file is always used, even for bot-created head branches.
  pull_request_target:
    branches: [main]

# pull_request_target exposes secrets and a writable token to a job that checks
# out head code, so keep the default grant read-only. Nothing here needs more.
permissions:
  contents: read

# One run per pull request and event: a new push cancels the run still going
# for the previous head. Without this, every `update-branch` or follow-up commit
# added a full run next to a stale one, and a day of forty pull requests queued
# behind runs whose result nobody would read (same pattern as e2e.yml). The
# event name is part of the key because the release PR fires both
# pull_request and pull_request_target for the same number, and the two must
# not cancel each other: `main` requires the checks of the one that runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check & test
    # Skip duplicate runs: for pull_request_target only run on the release branch;
    # for pull_request run on everything else.
    # head_ref is just a branch name and a fork can use any name it likes, so the
    # head-repo check is what actually keeps untrusted code out of this job.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull_request_target, check out the actual head commit (not base)
          ref: ${{ github.event.pull_request.head.sha }}

      # Same pnpm major as release.yml, which needs 11 to publish through npm
      # trusted publishing: the install and the scripts CI checks are then the
      # ones the release job runs. Every job in this file and e2e.yml uses it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:registry
      - run: pnpm check:i18n
      # Every Svelte prop has a counterpart in the React and Vue ports (or a
      # recorded reason not to): folder parity alone lets a port fall behind.
      - run: pnpm check:props
      # The framework-free engines the three packages share must stay byte-identical.
      - run: pnpm check:cores
      # Each package's Tailwind entry compiles to real colour rules and default tokens.
      - run: pnpm check:tailwind
      # The component count the READMEs and package.json state matches the registry.
      - run: pnpm check:readme-count
      - run: pnpm check
      # Also the gallery thumbnail gate: src/lib/components/docs/thumbs.test.ts
      # fails when a shipped slug has no entry in thumbs.json, when a listed
      # thumbnail file is missing, or when one is a near-blank frame.
      - run: pnpm test
      # The Svelte CLI add-on (sv-addon/): types, CSS/dependency rules and the add-on run
      # through sv's engine twice on sv's own templates. Offline; the CLI end to end is
      # the sv-addon consumer below.
      - run: pnpm --filter fancy-ui-sv run check
      - run: pnpm --filter fancy-ui-sv test
      - run: pnpm build
      # The prerendered source registries (React /r/*.json, Svelte /r/svelte/*.json, Vue /r/vue/*.json): closed imports, no test files, no product names.
      - run: pnpm check:registry-items
      - run: pnpm package
      # No raw bundler environment read survives into the packaged output: a
      # consumer's bundler may not define it, and the read then throws or
      # leaves a branch live. The package is named and --require-built is set so
      # a missing build fails here instead of the script finding nothing to check.
      - name: No raw environment read in dist
        run: node scripts/check-dist-env.mjs --require-built .

      # The published tarball is an allow-list (`files` in package.json) with
      # negated patterns for test rigs, the scaffold template and the per-folder
      # READMEs. 0.14.0 shipped 566 test files because a `.npmignore` cannot
      # exclude what `files` includes; this is what notices a regression.
      - name: Pack dry-run — allow-list sanity
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path);
            const stray = files.filter(p =>
              !p.startsWith('dist/') &&
              !['package.json','README.md','LICENSE'].includes(p));
            if (stray.length) { console.error('stray files in pack:', stray); process.exit(1); }
            const leaked = files.filter(p =>
              p.includes('.test.') || p.includes('/_template/') || p.endsWith('/README.md') || p.includes('web-audio-mock'));
            if (leaked.length) { console.error('test or scaffold files in pack:', leaked.slice(0, 20)); process.exit(1); }
            console.log(files.length + ' files, allow-list clean');
          "

  preview-health:
    name: Preview health (shard ${{ matrix.shard }})
    # Every shipped component page of the built docs site, every preview stage:
    # resolution errors, collapsed layouts, unsized canvases, invisible demos,
    # crashes and console errors (tests/e2e/preview-health.spec.ts). Two
    # projects: dark with WebGL through SwiftShader, and light with reduced
    # motion. The config builds the site and serves `vite preview` itself.
    # The no-GPU project and the sweep of production run nightly
    # (preview-health-nightly.yml).
    #
    # Four shards on four runners. The sweep is CPU-bound (SwiftShader draws
    # every WebGL frame on the CPU, two workers already starve each other on a
    # four-vCPU runner) and took 21 to 35 minutes on one runner, which set the
    # wall time of the whole pipeline; a shard takes a quarter of that. The
    # config is fullyParallel, so Playwright deals the 304 tests round-robin and
    # the heavy canvas pages spread across shards. Each shard uploads its own
    # summary; the `preview-health-summary` job below merges them into the one
    # report the reporter used to write, under the artifact name it always had.
    #
    # No `needs: [check]`: the job builds the site itself and reads nothing
    # from the other jobs. It used to wait for `check` only so that a failure
    # here could be read as "about the previews" — the failure classes in the
    # summary say that on their own, and the wait cost seven minutes of wall.
    #
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    # A shard is 6 to 9 minutes; twice that is a hung preview server, not a slow run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same Chromium cache key as e2e.yml and the consumers job.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Projects gpu + gpu-light-rm (see the script in package.json), this
      # shard's quarter of them.
      - run: pnpm test:preview-health --shard=${{ matrix.shard }}/4

      # This shard's summary, merged by the summary job below. Kept on success
      # too: it also carries the notes (slow spinners).
      - name: Upload the shard summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-health-shard-${{ matrix.shard }}
          path: test-results/preview-health.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the failing-stage screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-health-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  preview-health-summary:
    name: Preview health
    # The one check and the one report for the sweep: merges the four shard
    # summaries into test-results/preview-health.json (same shape as a single
    # run, plus a shard count), prints the summary grouped by failure class and
    # fails when a shard failed, is missing, or reports a failing page. The
    # merged file is uploaded under the name a single run used, so the nightly
    # baseline and anyone reading artifacts keep one place to look.
    #
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      !cancelled() && (
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'changeset-release/main') ||
        (github.event_name == 'pull_request'))
    needs: [preview-health]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The merge script is plain Node: no install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: preview-health-shard-*
          path: shard-summaries

      - name: Merge the shard summaries
        run: |
          node scripts/preview-health-merge.mjs --self-test
          node scripts/preview-health-merge.mjs --expect 4 shard-summaries

      - name: Upload the merged summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-health
          path: test-results/preview-health.json
          retention-days: 14
          if-no-files-found: warn

      # A shard that timed out or crashed before writing its summary is a red
      # shard with no entry above; this is what turns it into a red check here.
      - name: Every shard finished green
        if: ${{ !cancelled() && needs.preview-health.result != 'success' }}
        run: |
          echo "preview-health shards: ${{ needs.preview-health.result }}"
          exit 1

  react:
    name: React package
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # react/ is a workspace member — one install at the root covers it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fancy-ui-react run check
      - run: pnpm --filter fancy-ui-react run test
      - run: pnpm --filter fancy-ui-react run build
      # The port's record of truth is only true if something reads it: folders
      # exist, matrix exports are reachable from the barrel, no divergence still
      # claims a gap the tree has closed — and, the other way round, nothing the
      # package publishes is missing from the record. That converse pass reads
      # the runtime export list out of dist/index.js, because a regex over the
      # source cannot tell `export type { X }` from a value a consumer can
      # import, so the step runs after `build` and `--require-dist` makes a
      # missing artifact a failure rather than a silent half-check.
      - run: pnpm --filter fancy-ui-react exec node scripts/check-matrix.mjs --require-dist
      - run: pnpm --filter fancy-ui-react exec publint
      # Same check as the `check` job's, on this package's build.
      - name: No raw environment read in react/dist
        run: node scripts/check-dist-env.mjs --require-built react

      - name: Pack dry-run — allow-list sanity
        working-directory: react
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path);
            const stray = files.filter(p =>
              !p.startsWith('dist/') &&
              !['tailwind.css','PORTING.md','package.json','README.md','LICENSE'].includes(p));
            if (stray.length) { console.error('stray files in pack:', stray); process.exit(1); }
            // Three patterns, not one. The Svelte package names its rigs
            // <Name>Harness.test.svelte, so '.test.' alone caught them; the React
            // port renamed them <Name>Harness.tsx and 14 declaration files walked
            // straight through this gate. tsconfig.build.json excludes them now —
            // this is what notices if a future rename slips past it again.
            const leaked = files.filter(p =>
              p.includes('.test.') || p.includes('Harness.') || p.includes('web-audio-mock'));
            if (leaked.length) { console.error('test files in pack:', leaked); process.exit(1); }
            console.log(files.length + ' files, allow-list clean');
          "

      # The App Router example is the SSR/hydration gate: its prerender runs
      # every imported module server-side, and the build fails if the
      # "use client" boundary or any render path touches browser globals.
      - run: pnpm --filter fancy-ui-react-example-next run build

      # Second consumer gate, the static demo site: `output: "export"` prerenders
      # the whole home at build time with no request and no browser, so the
      # WebGL hero, the glass nav, the dialogs and the cameleon panels must all
      # survive a server render, and the theme script must inline cleanly.
      - run: pnpm --filter fancy-ui-react-demo run build

      # The "use client" boundary used to be checked here, by grepping two files
      # for the banner. It is checked by `build` now, in
      # react/scripts/check-dist-shape.mjs, which re-derives the whole split
      # from dist and fails in either direction — a component that lost the
      # directive, and a module that gained one it does not need. Two greps
      # could not have caught the second, which is the one that silently breaks
      # RSC consumers.
      - name: Resolve every declared subpath
        working-directory: react
        run: |
          node --input-type=module -e "
            const subpaths = ['fancy-ui-react', 'fancy-ui-react/cameleon',
              'fancy-ui-react/styles.css', 'fancy-ui-react/tailwind.css',
              'fancy-ui-react/package.json'];
            const failed = [];
            for (const specifier of subpaths) {
              try { import.meta.resolve(specifier); }
              catch (error) { failed.push(specifier + ': ' + error.code); }
            }
            if (failed.length) { console.error('unresolvable subpaths:', failed); process.exit(1); }
            console.log(subpaths.length + ' subpaths resolve');
          "

  react-18:
    name: React package — React 18 floor
    # peerDependencies advertise `react: ^18.0.0 || ^19.0.0`, and until this job
    # existed nothing in the repo ever installed React 18: the workspace pins
    # react 19.1 and @types/react 19, the example app pins 19, and the `react`
    # job above runs one install. Any React-19-only detail that slipped in
    # reached React 18 consumers as a console error or a broken component with a
    # green pipeline behind it.
    #
    # Two halves, because neither reaches the other's surface. The workspace is
    # re-installed on React 18 and the package's own suites run against it —
    # that is the client runtime, where the 18/19 deltas live: ref-callback
    # cleanup (use-element-ref guards it and nothing proved the guard),
    # hydrateRoot's onRecoverableError routing the sweep depends on, `act`
    # flushing, and useSyncExternalStore's server snapshot, which the sound
    # hooks are built on. Then the tarball is installed into a throwaway
    # consumer next to @types/react 18 and every emitted declaration is
    # compiled with skipLibCheck off — the declaration surface, which no test
    # reads.
    #
    # A whole-workspace override rather than a resolve alias: an alias moves
    # `react` for the files Vite transforms and leaves `@testing-library/react`
    # resolving the workspace's React 19 through Node, which puts two copies of
    # React in one tree and fails 300 tests for a reason that is not the
    # package's. Overriding makes the whole graph agree.
    #
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Job-local, never committed: the checkout is thrown away with the runner.
      - name: Pin the workspace to the React 18 floor
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'

          # Added by the react-18 CI job. Not committed.
          overrides:
            react: ^18.3.1
            react-dom: ^18.3.1
            "@types/react": ^18.3.0
            "@types/react-dom": ^18.3.0
          YAML

      # --no-frozen-lockfile because the override is the point: the lockfile
      # pins React 19 and must be allowed to re-resolve here.
      - run: pnpm install --no-frozen-lockfile

      - name: Confirm the workspace really is on React 18
        working-directory: react
        run: |
          version=$(node -p "require('react/package.json').version")
          types=$(node -p "require('@types/react/package.json').version")
          echo "react@$version, @types/react@$types"
          case "$version" in 18.*) ;; *) echo "expected React 18, got $version"; exit 1 ;; esac
          case "$types" in 18.*) ;; *) echo "expected @types/react 18, got $types"; exit 1 ;; esac

      # The source against @types/react 18: React 19 relaxed several type
      # shapes (a mutable `RefObject.current`, `ReactNode` accepting a promise),
      # and code written against the looser ones compiles here or it does not.
      - run: pnpm --filter fancy-ui-react run check

      - name: Package suites under React 18
        working-directory: react
        run: |
          pnpm exec vitest run \
            src/ssr-hydration.test.tsx src/ssr-determinism.test.ts \
            src/internals src/sound

      - run: pnpm --filter fancy-ui-react run build

      - name: Consumer on React 18 — declarations and server render
        working-directory: react
        run: node scripts/react18-consumer.mjs

  vue:
    name: Vue package
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # vue/ is a workspace member — one install at the root covers it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fancy-ui-vue run check
      - run: pnpm --filter fancy-ui-vue run test
      - run: pnpm --filter fancy-ui-vue run build
      - run: pnpm --filter fancy-ui-vue run test:scripts
      - run: pnpm --filter fancy-ui-vue exec node scripts/check-matrix.mjs --require-dist
      - run: pnpm --filter fancy-ui-vue exec publint
      # Same check as the `check` job's, on this package's build.
      - name: No raw environment read in vue/dist
        run: node scripts/check-dist-env.mjs --require-built vue

      - name: Pack dry-run — allow-list sanity
        working-directory: vue
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path);
            const stray = files.filter(p =>
              !p.startsWith('dist/') &&
              !['tailwind.css','PORTING.md','package.json','README.md','LICENSE'].includes(p));
            if (stray.length) { console.error('stray files in pack:', stray); process.exit(1); }
            const leaked = files.filter(p =>
              p.includes('.test.') || p.includes('Harness.') || p.includes('web-audio-mock'));
            if (leaked.length) { console.error('test files in pack:', leaked); process.exit(1); }
            console.log(files.length + ' files, allow-list clean');
          "

      # failOnError in nuxt.config.ts's nitro.prerender block is load-bearing:
      # without it a broken page just gets skipped and the build stays green.
      - run: pnpm --filter fancy-ui-vue-example-nuxt run generate

      - name: Resolve every declared subpath
        working-directory: vue
        run: |
          node --input-type=module -e "
            const subpaths = ['fancy-ui-vue', 'fancy-ui-vue/cameleon',
              'fancy-ui-vue/styles.css', 'fancy-ui-vue/tailwind.css',
              'fancy-ui-vue/package.json'];
            const failed = [];
            for (const specifier of subpaths) {
              try { import.meta.resolve(specifier); }
              catch (error) { failed.push(specifier + ': ' + error.code); }
            }
            if (failed.length) { console.error('unresolvable subpaths:', failed); process.exit(1); }
            console.log(subpaths.length + ' subpaths resolve');
          "

  vue-3-5:
    name: Vue package — Vue 3.5 floor
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Job-local, never committed: the checkout is thrown away with the runner.
      - name: Pin the workspace to the Vue 3.5 floor
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'

          # Added by the vue-3-5 CI job. Not committed.
          overrides:
            vue: 3.5.2
          YAML

      # --no-frozen-lockfile because the override is the point: the lockfile
      # pins a newer Vue and must be allowed to re-resolve here.
      - run: pnpm install --no-frozen-lockfile

      - name: Confirm the workspace really is on the Vue 3.5 floor
        working-directory: vue
        run: |
          version=$(node -p "require('vue/package.json').version")
          echo "vue@$version"
          case "$version" in 3.5.2) ;; *) echo "expected vue 3.5.2, got $version"; exit 1 ;; esac

      - run: pnpm --filter fancy-ui-vue run check
      - run: pnpm --filter fancy-ui-vue run test
      - run: pnpm --filter fancy-ui-vue run build
      - run: pnpm --filter fancy-ui-vue exec node scripts/vue-floor-consumer.mjs

  nuxt-module:
    name: Nuxt module
    # fancy-ui-nuxt registers fancy-ui-vue's components, styles and composables
    # in a Nuxt app. Its tests boot real Nuxt builds of the fixtures under
    # nuxt/test/fixtures (SSR HTML, client chunks, and computed styles in a
    # browser), so the job builds fancy-ui-vue first: the module, its manifest
    # and the fixtures all resolve the package through its built dist.
    #
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # nuxt/ is a workspace member — one install at the root covers it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fancy-ui-vue run build
      # The committed component list equals the component exports of the
      # built fancy-ui-vue barrel: a component added to the Vue package without
      # regenerating it would never be registered in Nuxt apps.
      - run: node nuxt/scripts/generate-manifest.mjs --check
      - run: pnpm --filter fancy-ui-nuxt run check

      # The browser tests launch through playwright-core, pinned to the same
      # version as the root @playwright/test, so they share its Chromium build
      # and the cache key used by e2e.yml and the consumers job.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm --filter fancy-ui-nuxt test
      - run: pnpm --filter fancy-ui-nuxt run build
      - run: pnpm --filter fancy-ui-nuxt exec publint

      # The real tarball rather than a dry run: `pnpm pack` is what a publish
      # uploads (workspace: ranges rewritten), and listing it is the check.
      - name: Pack — allow-list sanity
        working-directory: nuxt
        run: |
          out="$RUNNER_TEMP/nuxt-pack"
          mkdir -p "$out"
          pnpm pack --pack-destination "$out"
          tar -tzf "$out"/*.tgz | sort > "$out/files.txt"
          cat "$out/files.txt"
          stray=$(grep -vE '^package/(package\.json|README\.md|LICENSE|dist/.+)$' "$out/files.txt" || true)
          if [ -n "$stray" ]; then echo "stray files in pack:"; echo "$stray"; exit 1; fi
          for required in package/package.json package/README.md package/LICENSE package/dist/module.mjs package/dist/types.d.mts; do
            grep -qxF "$required" "$out/files.txt" || { echo "missing from pack: $required"; exit 1; }
          done
          echo "$(wc -l < "$out/files.txt") files, allow-list clean"

  changeset:
    name: Changeset present
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for changeset
        # Only required for PRs targeting develop (feature/fix branches).
        # PRs targeting main directly (infra, CI) and the automated "Version Packages" PR are exempt.
        if: github.base_ref == 'develop' && github.head_ref != 'changeset-release/main'
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "❌ No changeset file found. Run 'pnpm changeset' and commit the generated file."
            exit 1
          fi
          echo "✅ Changeset file present."

  consumers:
    name: Consumers (shard ${{ matrix.shard }})
    # Every package installed from its packed tarball into the apps under
    # examples/consumers, each copied outside the checkout so nothing can
    # resolve from the monorepo's node_modules: SvelteKit and Svelte + Vite for
    # fancy-ui-svelte, React + Vite and Next for fancy-ui-react, Vue + Vite and
    # Nuxt for fancy-ui-vue, Nuxt through the fancy-ui-nuxt module, an Astro
    # static site with Svelte islands, plus SvelteKit apps created by the
    # Svelte CLI and set up by the fancy-ui-sv add-on. Builds, then a
    # Playwright smoke per app. A failure here is about
    # the published shape (exports, files, declared dependencies, Tailwind
    # entry), not the source. See examples/consumers/README.md.
    #
    # Three shards on three runners: run-all.mjs deals the sorted consumer
    # list round-robin (`--shard k/3`), so an app added under scripts/consumers
    # joins a shard by itself and no list here can forget it. The apps in a
    # row took five to nine minutes (next 48 s, nuxt 78 s, react-vite 52 s,
    # vue-vite 36 s, sveltekit 25 s, svelte-vite 20 s, before the Nuxt module
    # app); a shard takes two to four. Each shard packs the packages it needs
    # itself (about a minute), which is why there is no `needs` on the package
    # jobs: the ordering only served to read a failure as "about the published
    # shape", and the summary table says that already.
    #
    # Same duplicate-run guard as `check` — see the comment there.
    if: |
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'changeset-release/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    # The cap stops a hung server from holding a runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The smokes use the repo's @playwright/test; cache its Chromium by
      # version, under the same key as e2e.yml so both share one entry.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The apps install with npm, outside the pnpm store setup-node caches.
      # They carry no lockfile, so this only saves downloads: npm still
      # resolves every range against the registry on each run. A saved key is
      # never overwritten, so the key carries the ISO week: a fresh entry is
      # saved each week from what the ranges resolve to then, and the restore
      # stays within the week so old tarballs do not pile up from week to week.
      - name: Read the week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: consumers-npm-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('examples/consumers/*/package.json') }}
          restore-keys: consumers-npm-${{ runner.os }}-${{ steps.week.outputs.week }}-

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm consumers --shard ${{ matrix.shard }}/3
