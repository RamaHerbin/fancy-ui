name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for changeset
        # Skip this check for the automated "Version Packages" PR
        if: ${{ github.head_ref != 'changeset-release/main' }}
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "❌ No changeset file found. Run 'pnpm changeset' and commit the generated file."
            exit 1
          fi
          echo "✅ Changeset file present."
