name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm 11 publishes through npm's trusted publishing: with no auth token
      # configured it exchanges this job's OIDC id-token (permissions above) for
      # a short-lived publish token, so no npm secret lives in this repo.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # No `registry-url` on purpose: setup-node would write an .npmrc whose
      # _authToken points at an env var that no longer exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm package

      # Build the React package before publishing — its exports map points at
      # dist/, and `changeset publish` does not run package build scripts.
      # (react's prepublishOnly rebuilds anyway; this step makes the build
      # visible and fail-fast.)
      - run: pnpm --filter fancy-ui-react run build

      - uses: changesets/action@v1
        with:
          # Creates/updates the "Version Packages" PR instead of pushing directly to main.
          # This prevents Vercel from triggering a deploy on every changeset commit.
          # When the "Version Packages" PR is merged, the tag and GitHub Release are created.
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both packages list this repository's release.yml as their trusted
          # publisher on the registry; the action logs "No NPM_TOKEN found" and
          # lets pnpm authenticate through OIDC. Provenance is attested as well.
          NPM_CONFIG_PROVENANCE: "true"
