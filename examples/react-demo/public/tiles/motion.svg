<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="motion-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <radialGradient id="motion-a">
      <stop offset="0" stop-color="#42a1ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#42a1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="motion-b">
      <stop offset="0" stop-color="#42d0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#42d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="motion-c">
      <stop offset="0" stop-color="#42a1ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#42a1ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="motion-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#motion-base)"/>
  <circle cx="380" cy="300" r="560" fill="url(#motion-a)"/>
  <ellipse cx="1220" cy="720" rx="680" ry="440" fill="url(#motion-b)"/>
  <circle cx="1120" cy="160" r="340" fill="url(#motion-c)"/>
  <ellipse cx="480" cy="920" rx="520" ry="280" fill="url(#motion-b)"/>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#motion-grid)"/>
</svg>
