# Workspace membership. The "." entry is LOAD-BEARING: changesets resolves
# packages through @manypkg/get-packages, which only versions/publishes glob
# matches — without ".", fancy-ui-svelte (the root package) silently drops out
# of the release pipeline. Do not remove it until the app physically moves to
# packages/svelte.
packages:
  - "."
  - "react"
  - "vue"
  - "nuxt"
  - "examples/*"
  - "sv-addon"

# esbuild postinstall allowance — also load-bearing (installs break without
# it), and pnpm has repeatedly rewritten this stanza into a placeholder.
# If it ever reads "set this to true or false", restore `true`.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# The a11y gate hands the e2e runner's page to axe: its playwright-core peer must be the
# runner's own, not a newer copy pulled in by an optional peer elsewhere in the tree.
# Keep this block LAST: the React 18 / Vue 3.5 floor CI jobs append their pins under it.
overrides:
  "@axe-core/playwright>playwright-core": 1.58.2
