<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// No-flash theme: set the light/dark class before paint. Accepted values
			// mirror THEMES in src/lib/stores/theme.svelte.ts; anything else (including
			// a theme name from an older build) resolves like "system".
			(function () {
				try {
					var saved = localStorage.getItem("fancy-ui-theme");
					var scheme;
					if (saved === "dark" || saved === "light") {
						scheme = saved;
					} else {
						scheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					}
					var root = document.documentElement;
					if (scheme === "dark") root.classList.add("dark");
					else root.classList.remove("dark");
					// Decorative motion switch (src/lib/stores/motion.svelte.ts): applied
					// before paint so a paused hero never animates for one frame.
					if (localStorage.getItem("fancy-ui-motion") === "paused") root.dataset.motion = "paused";
					// Locale (docs routes only): set lang + dir before paint, but only from
					// a persisted choice (?lang=, then localStorage) that is a supported
					// locale. Detection from navigator.language waits for hydration: the
					// server-rendered text is English, so flipping direction earlier would
					// mirror English copy for a frame. Both maps must mirror
					// src/lib/i18n/locales.ts (code list and `dir: "rtl"` entries) and are
					// enforced by scripts/check-i18n.mjs.
					if (location.pathname.indexOf("/docs") === 0) {
						var LOCALES = {
							en: 1,
							fr: 1,
							es: 1,
							de: 1,
							it: 1,
							pt: 1,
							pl: 1,
							cs: 1,
							ja: 1,
							ko: 1,
							"zh-Hans": 1,
							hi: 1,
							id: 1,
							tr: 1,
							ar: 1,
							fa: 1,
						};
						var RTL = { ar: 1, fa: 1 };
						var known = function (map, code) {
							return typeof code === "string" && Object.prototype.hasOwnProperty.call(map, code);
						};
						var loc = new URLSearchParams(location.search).get("lang");
						if (!known(LOCALES, loc)) loc = localStorage.getItem("fancy-ui-locale");
						if (known(LOCALES, loc)) {
							root.lang = loc;
							root.dir = known(RTL, loc) ? "rtl" : "ltr";
						}
					}
				} catch (e) {}
			})();
		</script>
		<!-- The SVG icon must stay first: AnimatedFavicon.svelte drives whichever link
		     `document.querySelector('link[rel="icon"]')` returns, and the SVG one is
		     also what SVG-capable browsers render. The .ico is the legacy fallback. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#0a0a0a" />
		<script
			defer
			src="https://stats.rama.app/p.js"
			data-website-id="052d9c71-4c0e-4a4f-94aa-9a88faf1af9d"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
