<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// No-flash theme: set the light/dark class + data-theme before paint.
			// (Full color tokens are applied by the theme store on hydration.)
			(function () {
				try {
					var saved = localStorage.getItem("fancy-ui-theme");
					var DARK = { dark: 1, synthwave: 1, dracula: 1, forest: 1, sunset: 1, mono: 1 };
					var scheme;
					if (!saved || saved === "system") {
						scheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					} else {
						scheme = DARK[saved] ? "dark" : "light";
					}
					var root = document.documentElement;
					if (scheme === "dark") root.classList.add("dark");
					else root.classList.remove("dark");
					if (saved && saved !== "system" && saved !== "light" && saved !== "dark") {
						root.setAttribute("data-theme", saved);
					}
					// Locale (docs routes only): set lang + dir before paint.
					// Precedence: ?lang= → saved → navigator.language. RTL for ar/fa.
					if (location.pathname.indexOf("/docs") === 0) {
						var RTL = { ar: 1, fa: 1 };
						var loc =
							new URLSearchParams(location.search).get("lang") ||
							localStorage.getItem("fancy-ui-locale") ||
							(navigator.language || "").toLowerCase();
						if (loc) {
							var lb = loc.toLowerCase().split("-")[0];
							root.lang = loc;
							root.dir = RTL[loc] || RTL[lb] ? "rtl" : "ltr";
						}
					}
				} catch (e) {}
			})();
		</script>
		<noscript><link rel="icon" type="image/svg+xml" href="/favicon.svg" /></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
